<h2>Categories</h2>

@if (isLoading()) {
  <p>Loading categories, please wait...</p>
} @else if (categories().length > 0) {
  @for (item of categories(); track item.id) {
  <div>
    <button (click)="openCategory(item)">
      {{ item.name }}
    </button>
  </div>
}
} @else {
  <p>No categories are available for this class.</p>
}

@if (popupService.showPopup()) {
  <div class="popup-overlay">
    <div
      class="popup-box"
      [class.success]="popupService.type() === 'success'"
      [class.error]="popupService.type() === 'error'"
      role="alertdialog"
      aria-live="polite"
    >
      <div class="popup-icon">
        @if (popupService.type() === 'success') {
          ✓
        } @else {
          !
        }
      </div>

      <p>{{ popupService.message() }}</p>

      @if (popupService.mode() === 'confirm') {
        <div class="popup-actions">
          <button type="button" class="confirm-btn" (click)="confirmLogout()">Yes</button>

          <button type="button" (click)="popupService.close()">No</button>
        </div>
      }
    </div>
  </div>
}

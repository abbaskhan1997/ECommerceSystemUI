@if (popupService.showPopup()) {
  <div class="popup-overlay">
    <div
      class="popup-box"
      [class.success]="popupService.type() === 'success'"
      [class.error]="popupService.type() === 'error'"
      role="alert"
      aria-live="polite"
    >
      <div class="popup-icon">
        @if (popupService.type() === 'success') {
          ✓
        } @else {
          !
        }
      </div>

      <p>{{ popupService.message() }}</p>

      <button type="button" (click)="popupService.close()">
        OK
      </button>
    </div>
  </div>
}
